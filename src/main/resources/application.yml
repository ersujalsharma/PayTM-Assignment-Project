spring:
  application:
    name: seat-reservation
  datasource:
    # DATABASE_URL is a standard provided by Render.
    # Falls back to local docker-compose postgres for dev.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${DATABASE_USERNAME:seats}
    password: ${DATABASE_PASSWORD:seats}
    hikari:
      # Pool sized for burst traffic. Keep it bounded so we never exhaust PG.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Fail FAST when the pool is saturated instead of blocking a thread for
      # many seconds. Under overload (more concurrent requests than connections)
      # a request bounces quickly; the service's bounded retry with backoff then
      # smooths it. A long timeout here is what caused request pile-ups
      # (waiting=57) and eventual 5xx on the tiny free-tier instance.
      connection-timeout: ${DB_CONN_TIMEOUT_MS:3000}
      validation-timeout: 2000
      pool-name: seats-pool
      # Server-side guards: cap how long any single statement or lock-wait can
      # block. A seat row contended by many txns will hit lock_timeout (SQLSTATE
      # 55P03) quickly and surface as a RETRYABLE error instead of pinning a
      # connection until the pool starves. These keep tail latency bounded and
      # 5xx at zero under heavy contention.
      data-source-properties:
        options: "-c statement_timeout=8000 -c lock_timeout=4000 -c idle_in_transaction_session_timeout=10000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  # Graceful shutdown so in-flight reservations complete on redeploy.
  shutdown: graceful
  tomcat:
    threads:
      # Keep the worker-thread count near the DB pool size. Admitting far more
      # requests than there are DB connections just creates a thundering herd
      # that all block on the pool. Matching them means excess load waits in the
      # accept queue briefly (or is shed) rather than piling onto 15 connections.
      max: ${TOMCAT_MAX_THREADS:40}
    # Bound the accept backlog so sustained overload sheds fast instead of
    # queueing unboundedly.
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:1000}

# Application-specific knobs
app:
  # Admission control: cap concurrently-processed write requests so a stampede
  # can't drive CPU/connections to saturation. Excess waits up to max-wait-ms
  # for a slot, else gets a fast 429 + Retry-After (clean shed, never a 5xx).
  # Set max-concurrent at or just below the DB pool size.
  admission:
    max-concurrent: ${ADMISSION_MAX_CONCURRENT:40}
    max-wait-ms: ${ADMISSION_MAX_WAIT_MS:800}
  reservation:
    # Default per-user seat limit for a show (overridable per show at creation).
    default-per-user-limit: 4
    # Hold TTL. A reservation left in HELD state longer than this auto-expires.
    hold-ttl-seconds: ${HOLD_TTL_SECONDS:120}
    # How often the sweeper looks for expired holds.
    sweep-interval-ms: ${SWEEP_INTERVAL_MS:5000}
  auth:
    # Static demo tokens -> user ids. In prod this would be a JWT/introspection.
    # Format: token1:user1,token2:user2  (if empty, any "Bearer <x>" maps user to <x>)
    tokens: ${AUTH_TOKENS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: seat-reservation
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    money.paytm: INFO
